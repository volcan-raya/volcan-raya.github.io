<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>notification soup</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* v09: the volcano stops being depicted. A white shape of four lines, on a flat white earth, in one field of sky; the sky carries the
   energy, blue to red-orange as the pressure builds. Inside, one gradient, red-orange to white, and the notes as red
   dots. The white is a skin one pixel thin, and past it you are straight in the orange: one cut, no easing. Looking down from above whitens the inside. You orbit, tilt and zoom; an eruption sends words away on wide waves.
   Each post is one medium: an image, a text or a voice. The type is a placeholder (Inter Tight) for LL Unica77:
   to change it, change FONTS in the script. DEV switches between it and a mono, JetBrains Mono (Ghostty's own). */
:root {
  --red: #c81600;
  --line: #f2f2f2;
  --dim: #8e8e93;
  --type: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: #050506; color: var(--line); font: 13px/1.4 var(--type); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }

/* the scene: the field (soup, wall, or the volcano outside) and, over it, the badges. The tremor moves both, never the controls */
#view { position: absolute; inset: 0; overflow: hidden; touch-action: none; }
#field, #marks { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#marks { z-index: 1; }

/* the badges are drawn; these buttons only carry them for the keyboard and screen readers (the ring is drawn too) */
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

/* the title, top left, over everything but the panels. The type is the placeholder above */
#title { position: fixed; z-index: 5; top: 12px; left: calc(16px + env(safe-area-inset-left, 0px)); right: 16px; margin: 0; pointer-events: none;
  color: #000; font: 400 12px/1.5 "DM Mono", ui-monospace, Menlo, monospace; }
#title span { display: block; }
:root[data-font="mono"] #title { letter-spacing: 0; }

/* the only control: + */
#plus { position: fixed; z-index: 5; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 48px; height: 48px; padding: 0; border: 0; border-radius: 50%; background: #000; display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 2px 14px rgba(0, 0, 0, .35); -webkit-tap-highlight-color: transparent; }
#plus svg { width: 22px; height: 22px; }
#plus:focus-visible { outline: 1.5px solid #fff; outline-offset: 3px; }
body.composing #plus, body.chatting #plus { display: none; }

/* the composer, after Telegram's input bar: a round button, a dark rounded field, the mic in a dark circle */
.bar { display: flex; align-items: flex-end; gap: 8px; margin: 0; }
.round { flex: none; width: 44px; height: 44px; padding: 0; border: 1px solid rgba(255, 255, 255, .09); border-radius: 22px; background: #1c1c1d;
  color: #fff; display: grid; place-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background .2s, box-shadow .1s; }
.round svg { width: 22px; height: 22px; }
.round:focus-visible { outline: 1.5px solid rgba(255, 255, 255, .7); outline-offset: 2px; }
.msgfield:focus { border-color: rgba(255, 255, 255, .22); }   /* like Telegram: the caret is enough */
.you.named { width: auto; max-width: 8.5rem; padding: 0 14px; display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 500 14px/42px var(--type); }
.mic.on { background: var(--red); border-color: var(--red); color: #000; }
.send { background: var(--red); border-color: var(--red); color: #fff; }
.msgfield { flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid rgba(255, 255, 255, .09); border-radius: 22px;
  background: #1c1c1d; color: #fff; font: 400 17px var(--type); outline: none; caret-color: #5e8bff; }
.msgfield::placeholder { color: #7d7d82; }
.fieldwrap { position: relative; flex: 1; min-width: 0; display: flex; }
.fieldwrap.with-clip .msgfield { padding-right: 46px; }
.clip { position: absolute; right: 4px; top: 4px; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 18px; background: none; color: #8e8e93; display: grid; place-items: center; cursor: pointer; }
.clip svg { width: 22px; height: 22px; }
.clip:hover, .clip:focus-visible { color: #fff; }
.clip:focus-visible { outline: 1.5px solid rgba(255, 255, 255, .7); }
/* a picture about to be sent */
.att { position: relative; align-self: flex-start; margin: 0 0 8px 52px; padding: 6px; border-radius: 14px; background: #1c1c1d; border: 1px solid rgba(255, 255, 255, .09); }
.att img, .msg .photo { display: block; width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }
.att button { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 12px; background: #2c2c2e; color: #fff; font: 600 14px/24px var(--type); cursor: pointer; }
.msg .photo { width: auto; height: auto; max-width: 220px; max-height: 260px; margin-bottom: 6px; border-radius: 14px; }
#composer { position: fixed; z-index: 6; left: calc(8px + env(safe-area-inset-left, 0px)); right: calc(8px + env(safe-area-inset-right, 0px));
  bottom: calc(10px + env(safe-area-inset-bottom, 0px)); max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; }

/* a name, or anonymous: a field that says Name inside it, as the composer says Vent, no outline; a round red arrow
   keeps it (or Enter); emptied and kept, you are anonymous again. No shadow under it: there are none elsewhere */
#idPanel { position: fixed; z-index: 8; left: calc(8px + env(safe-area-inset-left, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  width: min(340px, calc(100% - 16px)); box-sizing: border-box; padding: 12px; border-radius: 26px; background: rgba(28, 28, 29, .97);
  display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
/* the microphone's "under construction", over it, as the name panel is: no outline, no shadow */
#soon { position: fixed; z-index: 8; max-width: min(300px, calc(100% - 16px)); box-sizing: border-box; padding: 12px 16px; border-radius: 20px;
  background: rgba(28, 28, 29, .97); color: #fff; font-size: 14px; line-height: 1.4; pointer-events: none; }
#idPanel form { align-self: stretch; display: flex; gap: 8px; margin: 0; }
#idPanel input { flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 18px; border: 0; border-radius: 22px; background: #000; color: #fff; font-size: 16px; outline: none; }
#idPanel input::placeholder { color: #7d7d82; }
#keep { flex: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 22px; background: var(--red, #c81600); color: #fff; display: grid; place-items: center; cursor: pointer; }
#keep svg { width: 22px; height: 22px; }
#keep:disabled { opacity: .4; cursor: default; }
#keep:focus-visible { outline: 1.5px solid rgba(255, 255, 255, .7); outline-offset: 2px; }
body.chatting #idPanel { left: auto; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { padding: 8px 14px; border: 0; border-radius: 999px; background: #2c2c2e; font-size: 13px; cursor: pointer; }
.pill.go { background: var(--red); color: #fff; }
.pill:disabled { opacity: .4; cursor: default; }

/* a note opened: the conversation */
#chat { position: fixed; z-index: 7; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(400px, calc(100% - 32px)); max-height: min(70%, 680px); display: flex; flex-direction: column; overflow: hidden;
  background: #0e0e0f; border: 1px solid rgba(255, 255, 255, .08); border-radius: 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, .55); }
#chat header { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 18px; border-bottom: 1px solid rgba(255, 255, 255, .06); }
#cTitle { flex: 1; min-width: 0; font: 600 15px/1.2 var(--type); }
#cTitle small { display: block; margin-top: 2px; font: 400 12px var(--type); color: var(--dim); }
#chat header .round { width: 34px; height: 34px; }
#chat header .round svg { width: 16px; height: 16px; }
#listen[aria-pressed="true"] { background: #fff; color: #000; }
#cLog { list-style: none; margin: 0; padding: 14px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; overscroll-behavior: contain; }
.msg { max-width: 84%; align-self: flex-start; }
.msg .body { margin: 0; padding: 8px 13px 9px; border-radius: 18px 18px 18px 6px; background: #262628; font: 400 15px/1.35 var(--type); overflow-wrap: anywhere; }
.msg.op .body { background: #3b0d0a; font-size: 17px; }
.msg.mine { align-self: flex-end; }
.msg.mine .body { background: #a51d14; border-radius: 18px 18px 6px 18px; }
.voice { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border: 0; border-radius: 22px; background: #3b0d0a; color: #fff; cursor: pointer; }
.voice svg { width: 26px; height: 26px; }
.voice span { display: block; width: 110px; height: 2px; background: rgba(255, 255, 255, .55); }
.voice[aria-pressed="true"] { background: #fff; color: #000; }
.voice[aria-pressed="true"] span { background: #000; }
.msg .meta { margin: 4px 10px 0; font-size: 11px; color: var(--dim); }
.msg.mine .meta { text-align: right; }
#chat .bar { padding: 8px; border-top: 1px solid rgba(255, 255, 255, .06); }
@media (max-width: 600px) {
  #chat { left: calc(8px + env(safe-area-inset-left, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 80%; }
  body.chatting #idPanel { left: calc(8px + env(safe-area-inset-left, 0px)); right: auto; }
}

/* DEV: the noisy tools, shown with the "dev" square in the site bar */
#dev { position: fixed; z-index: 9; top: 12px; right: calc(10px + env(safe-area-inset-right, 0px)); width: min(260px, calc(100% - 20px)); box-sizing: border-box;
  max-height: calc(100% - 50px); overflow: auto; padding: 14px; border: 1px solid rgba(176, 38, 255, .55); border-radius: 14px; background: rgba(10, 10, 12, .9);
  font-size: 12px; display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: start; }
#dev .full { grid-column: 1 / -1; }
#dev .k { color: var(--dim); }
#dev button.t { padding: 0; border: 0; background: none; color: #fff; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(255, 255, 255, .35); }
#dev .seg { display: flex; gap: 14px; }
#dev .seg button[aria-pressed="true"] { color: #B026FF; text-decoration-color: #B026FF; }
#tube { position: relative; width: 12px; height: 150px; grid-row: span 6; cursor: ns-resize; touch-action: none; border: 1px solid rgba(255, 255, 255, .5);
  background: repeating-linear-gradient(to top, transparent 0 calc(10% - 1px), rgba(255, 255, 255, .16) calc(10% - 1px) 10%); }
#tube:focus-visible { outline: 1px solid #fff; outline-offset: 4px; }
#pFill { position: absolute; left: 2px; right: 2px; bottom: 2px; height: 0; background: linear-gradient(to top, #5a0a05, #ff3b30 60%, #ffb3a8); }
#pBoom { justify-self: start; padding: 6px 12px; border: 1px solid var(--red); border-radius: 999px; background: none; color: #ffb3a8; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
#pBoom:disabled { opacity: .35; cursor: default; }
#dev input[type=range] { width: 100%; margin: 0; accent-color: #B026FF; }
.meter { height: 4px; background: rgba(255, 255, 255, .12); }
.meter span { display: block; height: 100%; width: 0; background: #fff; }
</style>

<div id="view">
  <canvas id="field" aria-hidden="true"></canvas>
  <canvas id="marks" role="img" aria-label="the notes, red dots inside the volcano; pull back to see the volcano"></canvas>
</div>

<div id="notes" class="sr" role="list" aria-label="the notes"></div>

<button id="plus" type="button" aria-label="vent: write or say something"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
<div id="composer" hidden></div>

<section id="chat" role="dialog" aria-labelledby="cTitle" hidden>
  <header>
    <div id="cTitle"></div>
    <button id="listen" class="round" type="button" aria-pressed="false" aria-label="listen to them" title="listen to them"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"/></svg></button>
    <button id="cClose" class="round" type="button" aria-label="close" title="close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>

  </form>
</div>

<h1 id="title"><span>&lt;!--notification soup--&gt;</span><span>&lt;link rel="stylesheet" href="ecal.css"&gt;</span></h1>

<aside id="dev" aria-label="DEV" data-dev hidden>
  <div id="tube" role="slider" tabindex="0" aria-label="Pressure: drag to set it" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="pFill"></span></div>

  <span><span class="k">memory </span><span id="mem"></span></span>

  <label class="full"><span class="k">camera </span><span id="camVal"></span><input type="range" id="camera" min="0" max="4.5" step="0.001" value="0"></label>
  <span class="full"><span class="k">name </span><button class="t" id="devWho" type="button"></button></span>

  <div class="full seg" role="group" aria-label="Voice input">

    <button class="t" type="button" data-ink="black" aria-pressed="false">black</button>
  </div>
  <label class="full"><span class="k">cells from the axis to the foot </span><span id="cellsVal"></span><input type="range" id="cells" min="1" max="32" step="1"></label>
  <label class="full" id="intBox" hidden><span class="k">intensity of typed notes </span><span id="intVal">25</span><input type="range" id="intensity" min="0" max="100" value="25"></label>
</aside>

<script src="../shared/notification.js"></script>
<script>window.playhtmlReady = new Promise(r => { window.__playhtmlResolve = r; });</script>
<script type="module">
  // who is here at the same time is counted with playhtml (https://playhtml.fun): presence clears when a person leaves
  try {
    const { playhtml } = await import("https://unpkg.com/playhtml@2.15.0");
    await playhtml.init({ room: "langues" });   // a fixed room, so everyone meets whatever form of the address they typed
    window.__playhtmlResolve(playhtml);
  } catch (e) { console.warn("playhtml unavailable", e); window.__playhtmlResolve(null); }
</script>

<script>
// ================= basics =================
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const view = $("view"), field = $("field"), marks = $("marks"), mctx = marks.getContext("2d"), notesEl = $("notes");
let W = 0, H = 0, MDPR = 1, sized = "";
function resize() {
  const box = document.body.getBoundingClientRect();
  W = Math.round(box.width) || innerWidth; H = Math.round(box.height) || innerHeight; sized = W + "x" + H;
  MDPR = Math.min(2, devicePixelRatio || 1);
  marks.width = Math.round(W * MDPR); marks.height = Math.round(H * MDPR);
  lens(); sizeField();
}
// the notes live next to v05, one folder up: so does what was uploaded with them
const UP = "../";
const imgSrc = s => !s ? s : /^data:/.test(s) ? s : UP + s;

// ================= who is here =================
const hereEl = $("here");
const hereText = n => n === 0 ? "no one else" : n === 1 ? "one other" : `${n} others`;
(async () => {
  const ph = await window.playhtmlReady;
  let pr = null;
  try { pr = ph && ph.presence; } catch {}
  if (!pr) { hereEl.textContent = "can't tell"; return; }
  pr.setMyPresence("here", { t: Date.now() });
  const show = () => { let n = 0; for (const [, e] of pr.getPresences()) if (!e.isMe && e.here) n++; hereEl.textContent = hereText(n); };
  pr.onPresenceChange("here", show);
  setInterval(show, 2000);   // also notices people who leave
  show();
})();

// ================= identity: a name, or anonymous. No code and no language to choose (from 1.00 on): the notes are
// in English, and so is what the microphone hears =================
let me = { name: "", trip: "" };
try { const s = JSON.parse(localStorage.getItem("volcano-id") || "null"); if (s && s.name) me = { name: String(s.name).slice(0, 20), trip: "" }; } catch {}
const signature = name => name || "anonymous";
const idPanel = $("idPanel"), nm = $("nm");
const ICON_YOU = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 19.5c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4"/></svg>';
function showWho() {
  for (const b of document.querySelectorAll(".you")) {
    b.innerHTML = ICON_YOU;                       // always the person, never the name; the name is in its tooltip
    b.title = signature(me.name);
  }
  $("devWho").textContent = signature(me.name);
}
let idFrom = null;
function openId(from) {
  idFrom = from; idPanel.hidden = false;
  document.querySelectorAll(".you").forEach(b => b.setAttribute("aria-expanded", "true"));
  nm.value = me.name; updatePreview(); nm.focus({ preventScroll: true });
}
function closeId() {
  if (idPanel.hidden) return;
  idPanel.hidden = true;
  document.querySelectorAll(".you").forEach(b => b.setAttribute("aria-expanded", "false"));
  if (idFrom && idFrom.isConnected) idFrom.focus({ preventScroll: true });
  idFrom = null;
}
// the arrow (or Enter) keeps what is in the field; an empty field is anonymous again. With nothing typed and no name
// yet, there is nothing to keep, and the arrow waits
function updatePreview() { $("keep").disabled = !nm.value.trim() && !me.name; }
nm.addEventListener("input", updatePreview);
$("keep").form.addEventListener("submit", e => {
  e.preventDefault();
  const n = nm.value.trim();
  if (!n && !me.name) return;
  me = { name: n, trip: "" };
  try { if (n) localStorage.setItem("volcano-id", JSON.stringify(me)); else localStorage.removeItem("volcano-id"); } catch {}
  closeId(); showWho();
});
// the language speech is heard in: English, as the notes are
const lang = "en-US";

async function getJSON(url) {
  const r = await fetch(url + (url.includes("?") ? "&" : "?") + "v=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}

// ================= notes: the same as v05's, kept in ../sentences.json =================
// Reading: ../api.php?kind=sentences (shared, can write) → ../sentences.json (read-only) → a few built-in notes.
// New notes go to ../api.php, or stay in this browser when there is no api.php. A reply is a sentence with "re": <the note's id>.
// The keys in this browser are v05's too, so what was read there is read here.
const SENT_STARTERS = ["my landlord has ignored the leak in my ceiling for three weeks", "the 7:42 train was cancelled again", "deadline tomorrow, motivation somewhere in another country", "I said I'm fine eleven times today", "je déteste les lundis", "estoy harta de que me interrumpan", "my phone is at 3% and so am I", "why is adulthood mostly paperwork"];
const SENT_LOCAL_KEY = "lapilli-sentences-local";
// the type: one family, for everything drawn on the canvas too
const FONTS = { sans: "'Inter Tight', 'Helvetica Neue', Arial, sans-serif", mono: "'JetBrains Mono', Menlo, ui-monospace, monospace" };
let TYPE = FONTS.sans;
// a post is one thing: a picture, a voice or a text. The notes are shared with the older versions, so what each one
// shows is decided here. A comment is always its words.
const mediumOf = volcanoNote.mediumOf;
