<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { FullScreenQuad } from "three/addons/postprocessing/Pass.js";

// the volcano: to use the model from Blender, change these files. Units are kilometres on the grid (the block is 20 x 20,
// from -10 to 10, so its edges lie on the thick lines); height stretches y
const VOLCANO = { light: "volcano-light.glb", detailed: "volcano.glb", scale: 1, height: 1.25 };
// the versions, in DEV. Lightweight: the smaller model, no ambient occlusion, no path tracer. Metallic is grey metal: all its
// colour comes from what it reflects
const SKINS = { white: { color: 0xf0eeea, roughness: .9, metalness: 0 }, metal: { color: 0x8c8c8c, roughness: .36, metalness: 1 } };
const version = { q: "light", skin: "white" };
try { const v = JSON.parse(localStorage.getItem("volcano-v10-version")); if (VOLCANO[v?.q] && SKINS[v?.skin]) Object.assign(version, v); } catch {}

const BG = 0x3f3f3f, KEY = new THREE.Vector3(-.82, .46, .38).normalize();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
const canvas = $("scene"), view = $("view");

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.shadowMap.autoUpdate = false;           // nothing moves but the camera: the shadow is drawn once per model
const camera = new THREE.PerspectiveCamera(20, 1, 4, 3200);   // a long lens, as for an object

// ================= the light =================
// one big soft window in a dim room, the same for both renderers, so going from one to the other doesn't change the picture
function studio() {
  const w = 512, h = 256, data = new Float32Array(w * h * 4), d = new THREE.Vector3();
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const u = (x + .5) / w * Math.PI * 2, v = (y + .5) / h * Math.PI;
    d.set(Math.sin(v) * Math.cos(u), -Math.cos(v), Math.sin(v) * Math.sin(u));
    const soft = Math.max(0, d.dot(KEY)), L = .3 + 13 * soft ** 26 + .1 * Math.max(0, d.y);
    data.set([L, L, L * .985, 1], (y * w + x) * 4);
  }
  const t = new THREE.DataTexture(data, w, h, THREE.RGBAFormat, THREE.FloatType);
  t.mapping = THREE.EquirectangularReflectionMapping; t.wrapS = THREE.RepeatWrapping; t.minFilter = t.magFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
}
const env = studio();

// ================= the scene: what both renderers draw =================
const clay = new THREE.MeshStandardMaterial();
const groundTraced = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 1, metalness: 0 });   // only felt as a little bounced light: the grid is drawn over it
const floorGeo = new THREE.CircleGeometry(900, 64).rotateX(-Math.PI / 2);
function world() {
  const s = new THREE.Scene(); s.background = new THREE.Color(BG); s.environment = env;
  return s;
}
const scene = world(), traced = world();   // fast: with a sun for the shadow; traced: the same shapes on a floor, the window alone
traced.add(new THREE.Mesh(floorGeo, groundTraced));
const sun = new THREE.DirectionalLight(0xffffff, 2.3);
sun.position.copy(KEY).multiplyScalar(70); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 9; sun.shadow.blurSamples = 25; sun.shadow.bias = -.0004;
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 150 });
scene.add(sun);

// ================= the grid, and the room it dissolves into =================
// Drawn last, over either renderer: a sphere round everything whose every pixel follows its ray to the floor. It stops at
// the volcano (its depth is drawn first). The room is Blender's flat grey, and the grid fades into it; the block's shadow
// is laid on the floor here, soft and the same in both renderers.
const room = new THREE.Scene();
const gridMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, toneMapped: false,
  uniforms: { uBg: { value: new THREE.Color(BG).convertLinearToSRGB() } },
  vertexShader: "varying vec3 vW; void main() { vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }",
  fragmentShader: `
    uniform vec3 uBg; varying vec3 vW;
    float lines(vec2 p, float s) {
      vec2 q = p / s, w = fwidth(q), g = abs(fract(q - .5) - .5) / max(w, 1e-5);
      return (1. - min(min(g.x, g.y), 1.)) * (1. - smoothstep(.1, .34, max(w.x, w.y)));
    }
    float box(vec2 p, float grow) { vec2 d = max(abs(p) - 10. - grow, 0.); return length(d); }
    void main() {
      vec3 rd = normalize(vW - cameraPosition);
      if (rd.y > -1e-4) { gl_FragColor = vec4(uBg, 1.); return; }
      vec3 p = cameraPosition + rd * (-cameraPosition.y / rd.y); float dist = length(p.xz);
      float a = max(lines(p.xz, 1.) * .3 * (1. - smoothstep(20., 62., dist)), lines(p.xz, 5.) * .6 * (1. - smoothstep(34., 120., dist)));
      vec3 col = vec3(.392);                     // Blender's grid, #646464
      vec2 w = fwidth(p.xz), ax = (1. - min(abs(p.xz) / max(w, 1e-5) / 1.1, 1.)) * (1. - smoothstep(60., 190., dist));
      if (ax.y > 0.) { col = mix(col, vec3(.741, .216, .263), ax.y); a = max(a, ax.y); }   // X, #bd3743
      if (ax.x > 0.) { col = mix(col, vec3(.463, .663, .2), ax.x); a = max(a, ax.x); }     // Y, #76a933
      float thrown = box(p.xz - vec2(2., -1.), 0.), touch = box(p.xz, 0.);
      float shade = 1. - .5 * exp(-thrown * thrown / 7.) * .75 - .34 * exp(-touch * touch / .5);
      gl_FragColor = vec4(mix(uBg, col, a) * shade, 1.);
    }`,
});
const sphere = new THREE.Mesh(new THREE.SphereGeometry(1500, 32, 16), gridMat); sphere.renderOrder = 1; sphere.frustumCulled = false;
room.add(sphere);

// ================= the vent =================
// Nothing comes out. White outside, black within: the walls are painted over either renderer, a pixel at a time, so the rim
// is one clean line whatever the terrain's cells do. Above it, a thin smoke, which stops at nothing.
const NOISE = `
  float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float noise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
    return mix(mix(hash(i), hash(i + vec2(1., 0.)), f.x), mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), f.x), f.y); }
  float fbm(vec2 p) { float v = 0., a = .5; for (int i = 0; i < 4; i++) { v += a * noise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= .5; } return v; }`;
const ventT = { value: 0 }, R_RIM = .168;      // the vent's walls start at 170 m
const paint = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, toneMapped: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1,
  vertexShader: "varying vec2 vP; void main() { vP = position.xz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }",
  fragmentShader: `varying vec2 vP;
    void main() { float r = length(vP), w = fwidth(r); gl_FragColor = vec4(0., 0., 0., 1. - smoothstep(${R_RIM} - w, ${R_RIM} + w, r)); }`,
});
const smoke = new THREE.Mesh(new THREE.PlaneGeometry(4, 6).translate(0, 3, 0), new THREE.ShaderMaterial({
  transparent: true, depthTest: false, depthWrite: false, toneMapped: false, side: THREE.DoubleSide, uniforms: { uT: ventT, uSeen: { value: 1 } },
  vertexShader: "varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }",
  fragmentShader: `uniform float uT, uSeen; varying vec2 vUv; ${NOISE}
    void main() {
      float x = vUv.x * 2. - 1., y = vUv.y;
      float bend = (fbm(vec2(y * 1.7 - uT * .05, 3.)) - .5) * 1.3 * y + y * y * .28;   // leaning a little, as in still air
      float w = .022 + .3 * y, column = exp(-(x - bend) * (x - bend) / (w * w));
      float n = fbm(vec2((x - bend) * 3.2, y * 4.4 - uT * .16));
      float a = column * smoothstep(.0, .05, y) * (1. - smoothstep(.3, .95, y)) * smoothstep(.2, .72, n * (1.2 - y * .5));
      gl_FragColor = vec4(vec3(.78, .75, .76), a * .3 * uSeen);
    }`,
}));
smoke.renderOrder = 3; smoke.visible = false; room.add(smoke);

// ================= the soup =================
// v07's: the deep red, a slow field warped by noise with darker shapes drifting in it, redder round the unread notes. It is
// soft, so it is drawn small and stretched. Turning your head, it slides by as the notes do. It rises from the bottom of the
// view out of the black.
const soupRise = { value: 0 }, soupH = { value: 1 }, FIELD_SCALE = .45;
const infl = document.createElement("canvas"); infl.width = infl.height = 64;   // the notes' spots: unread in red, read in green
const inflTex = new THREE.CanvasTexture(infl); inflTex.flipY = false; inflTex.minFilter = inflTex.magFilter = THREE.LinearFilter; inflTex.generateMipmaps = false;
const fieldRT = new THREE.WebGLRenderTarget(4, 4, { depthBuffer: false });
const soupField = new FullScreenQuad(new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false, toneMapped: false,
  uniforms: { uRes: { value: new THREE.Vector2(4, 4) }, uTime: ventT, uRed: { value: 1 }, uShift: { value: new THREE.Vector2() }, uInfl: { value: inflTex } },
  vertexShader: "void main() { gl_Position = vec4(position.xy, 0., 1.); }",
  fragmentShader: `uniform vec2 uRes, uShift; uniform float uTime, uRed; uniform sampler2D uInfl; ${NOISE}
    void main() {
      vec2 uv = gl_FragCoord.xy / uRes, p = (gl_FragCoord.xy - .5 * uRes) / uRes.y * 1.8 + vec2(.9, .9) + uShift;
      float t = uTime;
      vec2 q = vec2(fbm(p + vec2(0., t * .05)), fbm(p + vec2(5.2, 1.3) - t * .04));
      float f = fbm(p + 1.7 * q + vec2(t * .03, -t * .02));
      // how red it is here: the share of unread notes (uRed), and each note's own spot, bent by the flow so it isn't round
      vec4 inf = texture2D(uInfl, clamp(vec2(uv.x, 1. - uv.y) + (q - .5) * .08, 0., 1.));
      float red = clamp(uRed + inf.r * .9 - inf.g * .75, 0., 1.);
      vec3 col = mix(vec3(.102, 0., 0.), vec3(.659, .133, .102), smoothstep(.08, .66, f) * (.22 + .78 * red));
      float d = fbm(p * .5 + vec2(-t * .022, t * .016) + 3.1);           // the dark shapes that drift in it
      col *= 1. - (.45 + .35 * (1. - red)) * smoothstep(.5, .72, d);
      col *= .82;
      col *= 1. - .25 * pow(abs(uv.x - .5) * 2., 2.);                   // a little darker at the sides
      gl_FragColor = vec4(col, 1.);
    }`,
}));
const soupBlit = new FullScreenQuad(new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false, toneMapped: false, uniforms: { map: { value: fieldRT.texture }, uRise: soupRise, uH: soupH },
  vertexShader: "varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }",
  fragmentShader: `uniform sampler2D map; uniform float uRise, uH; varying vec2 vUv;
    void main() { gl_FragColor = vec4(texture2D(map, vUv).rgb * smoothstep(0., 1., uRise * 2. - gl_FragCoord.y / uH), 1.); }`,
}));

// ================= the camera: orbit, tilt, zoom, as in v09 =================
// Under 9 km the camera swings over the summit and looks straight down; at DROP above the point below the vent it is at the
// rim, where the view is all black, and from there on down the soup comes up slowly while it lifts its head
const TARGET = new THREE.Vector3(0, 1.4, 0), PITCH_MIN = 2 * Math.PI / 180, PITCH_MAX = 80 * Math.PI / 180, D_OUT = 9, D_OVER = 3.4, D_SOUP = .5, D_MAX = 260;
const DROP = 2, UNDER = DROP, DOWN = 1.56, FOV = 20, FOV_SOUP = 55, LOOK_MAX = 1.25;
const below = new THREE.Vector3(0, 1.4, 0);    // the point below the vent the descent looks at
let lens = FOV, dive = 0, rise = 0;
const orbit = { yaw: 2.45, pitch: .2, dist: 50, look: 0, spin: 0 }, aim = { ...orbit };
// the way in is a rail: under D_OUT the camera depends on the distance alone, so going out is going in, backwards. Nothing
// can turn it there. In the soup you turn your head (look, spin), never the orbit, and the head comes back as you leave.
const inSoup = () => orbit.dist < D_SOUP * 1.15, onRail = () => !inSoup() && Math.min(orbit.dist, aim.dist) < D_OUT, RAIL_SPEED = 1.7;
const aimAt = TARGET.clone(), camX = new THREE.Vector3(1, 0, 0), camY = new THREE.Vector3(0, 1, 0), camZ = new THREE.Vector3(0, 0, 1);
const K = .0035, WHEEL = .0011, PINCH = 1.7;
const pan = (dx, dy) => {                      // the hand: the view slides under the pointer, in the plane it looks at
  if (onRail() || inSoup()) return;
  const s = 2 * orbit.dist * Math.tan(camera.fov * Math.PI / 360) / (canvas.clientHeight || 1);
  aimAt.addScaledVector(camX, -dx * s).addScaledVector(camY, dy * s);
  aimAt.set(clamp(aimAt.x, -24, 24), clamp(aimAt.y, -6, 14), clamp(aimAt.z, -24, 24));
};
const zoom = ds => { aim.dist = clamp(aim.dist * Math.exp(ds), D_SOUP, D_MAX); };
const turn = (dx, dy) => {
  if (inSoup()) { aim.spin -= dx * K; aim.look = clamp(aim.look + dy * K, -LOOK_MAX, LOOK_MAX); return; }
  if (onRail()) return;
  aim.yaw -= dx * K; aim.pitch = clamp(aim.pitch + dy * K, PITCH_MIN, PITCH_MAX);
};
const focus = new THREE.Vector3(), ahead = new THREE.Vector3();
function place() {
  const { smoothstep } = THREE.MathUtils, s = orbit.dist;
  dive = 1 - smoothstep(s, D_OVER, D_OUT);
  rise = 1 - smoothstep(Math.log(s), Math.log(D_SOUP * 1.05), Math.log(UNDER));   // from the rim, even all the way, as the zoom is
  const pitch = THREE.MathUtils.lerp(orbit.pitch, DOWN, dive), cp = Math.cos(pitch);
  focus.lerpVectors(TARGET, below, dive);
  camera.position.set(focus.x + Math.sin(orbit.yaw) * cp * s, focus.y + Math.sin(pitch) * s, focus.z + Math.cos(orbit.yaw) * cp * s);
  if (rise > 0) {                              // the head lifts from straight down to level
    const e = THREE.MathUtils.lerp(-DOWN, orbit.look, rise), ce = Math.cos(e), head = orbit.yaw + orbit.spin * rise;
    ahead.set(-Math.sin(head) * ce, Math.sin(e), -Math.cos(head) * ce).add(camera.position); camera.lookAt(ahead);
  } else camera.lookAt(focus);
  camera.fov = lens + (FOV_SOUP - lens) * rise; camera.near = clamp((s - 1.4) * .2, .02, 4); camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  camera.matrixWorld.extractBasis(camX, camY, camZ);
}
addEventListener("wheel", e => {
  e.preventDefault();
  const unit = e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? innerHeight : 1;
  zoom(e.deltaY * unit * (e.ctrlKey ? WHEEL * 9 : WHEEL));   // pinching on a trackpad comes as a wheel with ctrl
}, { passive: false });
let gScale = 1;                                // Safari's trackpad pinch
addEventListener("gesturestart", e => { e.preventDefault(); gScale = e.scale || 1; });
addEventListener("gesturechange", e => { e.preventDefault(); if (pointers.size) return; const s = e.scale || 1; zoom(-Math.log(s / gScale) * PINCH); gScale = s; });
