<style>
/* v20 (3.04), after v18 (3.03), the 3.0x branch: the volcano is v18's big black triangle and stays there; no camera any
   more: scrolling goes in and out of the soup through a gradient. Two eruptions, after rai's own: v09's waves of words,
   calmer, for the 8 most answered notes, freezing and fading; v07's balls for their replies, falling on the triangle and
   flowing down it as their text. The soup: v19's blur round an opened note, the dialogue scrolling inside itself, a
   mood chosen at the door (an emoji, and a name from it), the others as black cursors with theirs. Two kinds of ball
   only: unread filled, read a ring. One sans, no Mebar. No ⏏ and no click on the triangle: only scrolling goes in and out. It opens at the top, on the volcano, NOTIFICATION SOUP above it. Built by two windows at once: see NOTES.md. */
/* v18 (rai x aya, 19/11/26), after rai's 3.02 (v16) and aya's v07 and v14, made of three:
   the soup, aya v14's (soup.js): the conversations going on, an opened rant with its replies under it at once, on a
   thread, and a reply coming in while it is open added there live; the simulated others replying and throwing balls;
   rai's 1.04 moves on (data-ver v18): unread balls playing by themselves now and then, a ball let go while moving thrown.
   In the soup's own red on the orange, with its intro.
   the eruption, aya v07's (volcano.js): out of the triangle's apex, the letters thrown in jets, lobs and sprays, each word
   its own size, landing as lava in rows down the mountain; the smoke thrown the same way, going up. DEV, volcano: erupt.
   the way in and out, rai v16's zoom into the ⏏, scrolled (camera.js): scrolling down dives into the small ⏏ at the top,
   the soup growing round it until it is the volcano (its bar fading on the way: the volcano has none), and goes on down
   into the mountain, as far as the lava; scrolling up comes back the same way. A click on the ⏏ or the volcano goes the
   whole way at once. DEV, camera: how much scrolling the way in or out takes.
   aya v07, after v06: the letters much bigger and smaller, each word its own size, the near ones swelling as they fly at
   us; 3.01's smoke (the words drifting off the apex between eruptions) gone; the smoke now thrown as the lava is, in
   jets, lobs and sprays of letters, but going up, drifting, curling, swelling and thinning out (volcano.js).
   aya v06, after v05: the eruption more like a volcano's. The letters go in throws: jets (fast, low, a strand of letters
   one behind the other on one arc), lobs (slow, high, a looser strand) and sprays (each letter on its own arc). A strand
   lands as one, up the slope, and its letters run down into their places. The mountain is seen as 3D: rows near the apex
   far and small, lower ones near and large; a letter grows as it flies towards us (volcano.js, startLava).
   aya v05, after v04: no ground; the triangle's sides go on down past the screen's edges (field.js), and outside you
   can scroll down into the mountain (wheel, a drag, the arrows; camera.js, pan) until it fills the screen with black.
   The lava fills the mountain: its mixed words in many rows, each as wide as the mountain at its height, row under row,
   as far down as it goes (volcano.js). At an eruption the view goes back up to the apex.
   aya v04, after v03: the eruption is outside. Under the triangle, a black ground, the whole width, cuts the screen in
   two (field.js). At the eruption you are taken out of the soup, and the letters are thrown from the triangle's apex, arc
   and fall onto the ground, mixed into a new text, row under row; white-hot, they flow on, cool through orange and red,
   stop, and leave a red trace on the black. Smoke goes up into the orange. (DEV, aya: go out / stay; back in / stay out.)
   aya v03, after v02: a volcanic eruption, letter by letter. After the stop motion (or at once, without it), the
   rants' letters are thrown out of a vent at the bottom of the soup, one by one, fast, each on an arc, and fall back to
   the ground: a word's letters side by side, the words of different rants mixed into a new, almost incoherent text,
   row on row from the ground up. Hot, they flow on a little, cool, stop and fade, leaving a light trace. Some words go
   up as smoke instead (volcano.js, "the eruption, letter by letter"; DEV, aya).
   aya v02, after v01: only rai's own notes, not the ones others added since, and by default only ten of them, with
   their replies, so the soup stays light (soup.js, PICK; DEV aya: "notes": rai's 10, rai's 44). The notes are this version's
   own, in notes.js, and their pictures in perref/, in this folder: nothing is read from rai's.
   aya v01, after v00: a rant left open trembles as the eruption comes, its letters each on its own as in the stop
   motion, harder and harder (volcano.js pre(), DEV aya: "an open rant trembles from"); at the eruption it is closed by
   force, and then the stop motion plays.
   aya v00, after rai's v15 (3.01), in its own folder with its own copy of the soup (soup.js), so v15 and the
   shared soup stay as they are. New: the balls bump into each other and push the others (soup.js, "bumping"); at an
   eruption every vent passes, one by one, fast, as in stop motion, its letters trembling (volcano.js, "stop motion");
   a second visitor, simulated, with its own cursor, who hovers, picks up and throws balls (soup.js, "others").
   DEV: the new rows are in the tab "aya".
   v15 (3.01), after v14: the volcano is no longer the emoji but the eject sign, ⏏, black, large on the orange, the
   words leaving its triangle's apex; the way out of the soup is the eject itself, ⏏, alone at the top.
   v14 (3.00), a branch of its own, new: only text, and flat. The volcano is an emoji, 🌋, in the middle of the orange, and
   the words leave its crater as in the drawing: smoke, black, out in a fan; lava, hot and blurred, out to the sides and
   down. Pressure and eruption as in 1.03. It opens in the soup, orange all the way up. Nothing scrolls: a click on the
   volcano goes in (it grows round its crater, on that one axis, until its lava is the soup's orange), and the way out is
   at the top of the soup, still being chosen: a row of propositions, a to e, any of them takes you out. The soup is
   1.03's, flat: every ball the same size, on the screen, no depth.
   v13 (1.03), after v12: the hole stays black. No disc: the volcano's lines always on, red-orange (8 rings, 12 meridians,
   0.75 px). The sky starts at what was 40% and is a gradient: only its upper part goes red-orange, so an eruption stays
   readable. An eruption sends out 8 to 80 words (DEV), the notes repeated when there are fewer.
   v12 (1.02), after v11: the volcano a big, pointed mountain, alone in the sky; the zoom stops before its foot shows.
   v11 (1.01), after v09 (1.00): no grid; the volcano on a white disc floating in the sky, a flat black hole on top, and the
   way in is 2.00's: over the summit and down the hole.
   v09: the volcano stops being depicted. A white shape of four lines, on a flat white earth, in one field of sky; the sky carries the
   energy, blue to red-orange as the pressure builds. Inside, one gradient, red-orange to white, and the notes as red
   dots. The white is a skin one pixel thin, and past it you are straight in the orange: one cut, no easing. Looking down from above whitens the inside. You orbit, tilt and zoom; an eruption sends words away on wide waves.
   Each post is one medium: an image, a text or a voice. The type is a placeholder (Inter Tight) for LL Unica77:
   to change it, change FONTS in the script. DEV switches between it and a serif, Spectral.
   The page is in files by subject, so two windows can work on it at once (see core.js): volcano.js, terrain.js,
   camera.js and soup.js (+ soup.css) each hold one subject; core.js, field.js and this page are shared. */
:root {
  --red: #c81600;
  --line: #f2f2f2;
  --dim: #8e8e93;
  --type: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: #050506; color: var(--line); font: 13px/1.4 var(--type); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }

/* the scene: the field (soup, wall, or the volcano outside) and, over it, the badges. The tremor moves both, never the controls */
#view { position: absolute; inset: 0; overflow: hidden; touch-action: none; }
#field, #marks { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#marks { z-index: 1; }

/* the badges are drawn; these buttons only carry them for the keyboard and screen readers (the ring is drawn too) */
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

/* v20: the title, at the top of the page, in the sky above the volcano: NOTIFICATION SOUP, black, large, centred, set as an
   opened note is (soup.css #big .words: the sans at 500, max(28px, 7.5vw), leading 1, on the note's margins), but spaced
   wider, .04em (19/11/26). No
   opening animation any more (v18's, drawn away into the soup, is gone). It is on the page: camera.js moves it up with
   the volcano as you scroll down. For screen readers it stays; never in the way of a click */
#title { position: fixed; z-index: 0; left: var(--side, 40px); right: var(--side, 40px); top: 0; margin: 0; pointer-events: none;
  color: #000; font: 500 var(--tfs, max(28px, 7.5vw))/1 var(--type); letter-spacing: .04em; text-align: center; will-change: transform; }
/* the mood at the door (soup.js, window B's #mood): no card round it, just the question and the faces on the sky
   (19/11/26: "remove the white box around the 5 emojis"); here, so soup.css stays B's */
html body #mood { background: none; box-shadow: none; color: #FF4500; top: var(--mood-y, 50%); }   /* on the black triangle (camera.js sets --mood-y), in the soup's orange */
/* no grey square round a face, hovered or picked; a face grows under the pointer; no "you are …" */
html body #mood button, html body #mood button:hover, html body #mood button:focus-visible, html body #mood button[aria-pressed="true"] { background: none; }
html body #mood button:hover, html body #mood button:focus-visible { transform: scale(1.3); }
html body #mood .named { display: none; }
/* picked: it stays on the volcano, scrolled away with it, until we are in the soup (camera.js, data-mood-hold) */
html[data-mood-hold] body #mood { display: block !important; opacity: 1 !important; pointer-events: none; }
#title span { display: block; }

/* DEV: the noisy tools, shown with the "dev" square in the site bar */
#dev { position: fixed; z-index: 9; top: 12px; right: calc(var(--grid-margin, 24px) + env(safe-area-inset-right, 0px)); width: min(300px, calc(100% - 2 * var(--grid-margin, 24px)));   /* its right edge on the site's margin, as the bar's dev box */ box-sizing: border-box;
  max-height: calc(100% - 50px); overflow: auto; padding: 14px; border: 1px solid #C16CFF; border-radius: 2px; background: rgb(5, 5, 6);
  font-size: 12px; display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: start; }
#dev .full { grid-column: 1 / -1; }
#dev .k { color: var(--dim); }
#dev button.t { padding: 0; border: 0; background: none; color: #fff; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(255, 255, 255, .35); }
#dev .seg { display: flex; gap: 14px; }
#dev .seg button[aria-pressed="true"] { color: #C16CFF; text-decoration-color: #C16CFF; }
#tube { position: relative; width: 12px; height: 150px; grid-row: span 3; cursor: ns-resize; touch-action: none; border: 1px solid rgba(255, 255, 255, .5);
  background: repeating-linear-gradient(to top, transparent 0 calc(10% - 1px), rgba(255, 255, 255, .16) calc(10% - 1px) 10%); }
#tube:focus-visible { outline: 1px solid #fff; outline-offset: 4px; }
#pFill { position: absolute; left: 2px; right: 2px; bottom: 2px; height: 0; background: linear-gradient(to top, #5a0a05, #ff3b30 60%, #ffb3a8); }
#pBoom { justify-self: start; padding: 6px 12px; border: 1px solid var(--red); border-radius: 999px; background: none; color: #ffb3a8; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
#pBoom:disabled { opacity: .35; cursor: default; }
#dev input[type=range] { width: 100%; margin: 0; accent-color: #C16CFF; }
/* DEV in tabs (core.js), each file's rows in its own group; and one type, the title's mono, whatever the piece's */
#dev, #dev button, #dev input, #dev select { font-family: "DM Mono", ui-monospace, Menlo, monospace; }
#dev .devGroup { display: contents; }
#dev .devTabs { position: sticky; top: -14px; z-index: 1; margin: -14px -14px 2px; padding: 10px 10px 0; display: flex; gap: 0;
  background: rgb(5, 5, 6); border-bottom: 1px solid rgba(193, 108, 255, .35); }
#dev .devTabs button { flex: 1 1 auto; padding: 6px 2px 8px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none;
  color: var(--dim); font-size: 11.5px; cursor: pointer; }
/* out of the soup: the propositions, in a row at the top, black on the orange, there at once (no fade); any of them takes you out */
  width: max-content; max-width: calc(100% - 20px); }
  display: grid; justify-items: center; gap: 2px; transition: transform .25s ease; }
#dev .devTabs button[aria-selected="true"] { color: #C16CFF; border-bottom-color: #C16CFF; }
#dev .devTabs button:focus-visible { outline: 1px solid #C16CFF; outline-offset: -2px; }
/* DEV on a phone: only "erupt", on its own at the top right, whatever tab is open; the rest of the panel is not there */
@media (max-width: 600px) {
  #dev { visibility: hidden; pointer-events: none; }
  #dev .devGroup:has(#pBoom)[hidden] { display: contents !important; }
  #dev #pBoom { visibility: visible; pointer-events: auto; position: fixed; z-index: 9; top: 12px; right: calc(12px + env(safe-area-inset-right, 0px));
    background: #000; border-color: #000; color: #fff; padding: 8px 14px; }
  #dev #pBoom:disabled { opacity: .45; }
}

/* v20 on: one look, rai's (the soup's red on the orange): aya's gradient and its toggle are gone, and so is MORPH */
#avatar { position: fixed; z-index: 6; top: 12px; right: 16px; padding: 0; border: 0; background: none; cursor: pointer; }
/* how the others are seen, cursors or evangelions: it shows the other one, a click away */
#avatar span { display: grid; place-items: center; width: 48px; aspect-ratio: 16 / 9; border: .75px solid #000; border-radius: 2px; background: #fff1e6; overflow: hidden; }
#avatar img { display: block; height: 24px; width: auto; }
#avatar i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin: 0 1.5px; }
/* it shows the next one: cursors ↔ evangelions (v20: no balls) */
#avatar .dots, #avatar img, #avatar .arr { display: none; }
html[data-avatar="cursor"] #avatar img, html[data-avatar="eva"] #avatar .arr { display: block; }
#avatar:focus-visible { outline: 1.5px solid #000; outline-offset: 3px; border-radius: 4px; }
</style>
